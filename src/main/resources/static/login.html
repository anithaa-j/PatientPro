<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PatientPro Login</title>

    <link rel="stylesheet" href="css/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- Background -->

    <div class="background">

        <div class="grid"></div>

        <div class="circle circle1"></div>

        <div class="circle circle2"></div>

        <div class="circle circle3"></div>

    </div>

    <!-- Main Container -->

    <div class="container">

        <!-- LEFT -->

        <div class="left-panel">

            <div class="status">

                <span class="dot"></span>

                PATIENT MANAGEMENT SYSTEM

            </div>

            <div class="platform">

                <span>❤</span>

                PMS • PatientPro

            </div>

            <h1>

                Patient Records,<br>

                At A Glance.

            </h1>

            <p>

                Securely access patient records,

                appointments,

                prescriptions and

                laboratory reports,

                in one connected workspace.

            </p>

            <div class="stats">

                <div>

                    <h2>24/7</h2>

                    <span>MONITORING</span>

                </div>

                <div>

                    <h2>100%</h2>

                    <span>ENCRYPTED</span>

                </div>

                <div>

                    <h2>HL7</h2>

                    <span>COMPLIANT</span>

                </div>

            </div>

        </div>

        <!-- RIGHT -->

        <div class="right-panel">

            <div class="login-card">

                <h2>Welcome Back</h2>

                <p>Sign in to continue</p>

                <form action="dashboard.html">

                    <label>Username</label>

                    <input
                        type="text"
                        placeholder="Enter Username"
                        required>

                    <label>Password</label>

                    <input
                        type="password"
                        placeholder="Enter Password"
                        required>

                    <div class="options">

                        <label>

                            <input type="checkbox">

                            Remember Me

                        </label>

                        <a href="#">Forgot Password?</a>

                    </div>

                    <button type="submit">

                        LOGIN

                    </button>

                </form>

            </div>

        </div>

    </div>

    <!-- ECG -->

    <div class="ecg">

        <svg viewBox="0 0 1200 120">

            <path
                d="M0 60
                L160 60
                L180 60
                L195 20
                L210 95
                L225 60
                L520 60
                L540 60
                L555 25
                L570 95
                L585 60
                L900 60
                L920 60
                L935 25
                L950 95
                L965 60
                L1200 60">

            </path>

        </svg>

    </div>

</body>

</html>
